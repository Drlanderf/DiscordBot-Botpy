name: Check PR

on:
  pull_request:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: botpy:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check syntax of every Python file
        run: |
          docker run --rm botpy:test python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8'), str(p)) for p in pathlib.Path('.').rglob('*.py')]; print('syntax OK')"

      - name: Check that the dependencies import
        run: |
          docker run --rm botpy:test python -c "import discord, aiohttp, aiosqlite, yaml, dotenv; print('imports OK')"
