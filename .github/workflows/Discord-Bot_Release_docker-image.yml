name: Discord Bot Docker CI/CD

on:
 workflow_dispatch:
 push:
  branches:
    - release
jobs:
  build-Docker-Image:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
    - uses: actions/checkout@v3

    - name: Obtaining the tag. . .
      uses: xom9ikk/version-by-tag@v1
      id: version_by_tag

    - name: Docker Setup QEMU
      uses: docker/setup-qemu-action@v2.1.0

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v2.2.1

    - name: Check Docker credentials availability
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        DOCKER_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      run: |
        if [ -n "$DOCKER_USERNAME" ]; then
          echo "Docker username: present"
        else
          echo "Docker username: EMPTY"
        fi

        if [ -n "$DOCKER_TOKEN" ]; then
          echo "Docker token: present"
        else
          echo "Docker token: EMPTY"
        fi


    - name: Login to Docker Hub. . .
      uses: docker/login-action@v2.1.0
      with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build and push the Image. . .
      uses: docker/build-push-action@v3.2.0
      with:
        build-args: |
          BOT_VERSION=${{ steps.version_by_tag.outputs.tag }}
          BOT_COMMIT=${{ github.sha }}
          --env-file .env.example up
        push: true
        tags: landerf/botpy:latest,landerf/botpy:release_${{steps.version_by_tag.outputs.tag}}