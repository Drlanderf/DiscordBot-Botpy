name: Discord Bot Docker CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  build-Docker-Image:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v7

      - name: Obtaining the tag. . .
        uses: xom9ikk/version-by-tag@v1
        id: version_by_tag

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub. . .
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push the Image. . .
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            BOT_VERSION=${{ steps.version_by_tag.outputs.tag }}
            BOT_COMMIT=${{ github.sha }}
          tags: |
            landerf/botpy:latest
            landerf/botpy:release_${{ steps.version_by_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
