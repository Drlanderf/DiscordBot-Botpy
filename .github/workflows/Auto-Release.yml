name: Release Drafter

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # nécessaire pour créer/mettre à jour le brouillon de release
      pull-requests: read    # lecture des PR fusionnées
    steps:
      - uses: actions/checkout@v6

      - uses: release-drafter/release-drafter@v7.10.0
        with:
          config-name: file:.github/template/release-template.yml
