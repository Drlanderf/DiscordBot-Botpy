twitch:
  chaine: "tonpseudo"            # le pseudo de l'URL twitch.tv/tonpseudo
  salon_id: 123456789012345678   # salon où annoncer le live
  role_id: 123456789012345679    # rôle à mentionner (celui de ton groupe "Twitch")
  ping: true                     # true = mentionne le rôle, false = annonce sans mentionner personne
  message: "{role}, **{nom}** est en live sur : **{jeu}** !\n <{lien}>"

youtube:
  salon_id: 123456789012345678     # salon d'annonces commun aux deux chaînes
  ping: true                       # false = annonces sans mentionner personne
  ping_live: false         # mentionner le rôle pour les lives (false = annonce sans mention)
  annonces_live: false      # false = ne jamais annoncer les lives YouTube
  short_duree_max: 60      # durée max (en secondes) d'un Short. 0 = ne rien traiter comme un Short
  message_video: "{role}, **{nom}** vient de publier une nouvelle vidéo, Laisse un like et un commentaire ! \n<{lien}>"
  message_live: "{role}, **{nom}** est en live sur YouTube : \n<{lien}>"
  chaines:
    - nom: "Tech"
      channel_id: "UCxxxxxxxxxxxxxxxxxxxxxx"
      role_id: 123456789012345679   # ton rôle "YouTube Tech"
    - nom: "Gaming"
      channel_id: "UCyyyyyyyyyyyyyyyyyyyyyy"
      role_id: 123456789012345680   # ton rôle "YouTube Gaming"
      # Réglages facultatifs pour cette chaîne seulement :
      # salon_id: 123456789012345681
      # ping: false
      # message_video: "..."

botban:
  salon_id: 123456789012345678     # le salon piège
  salon_logs: 0                    # facultatif : salon de logs dédié (0 = utilise salons.logs)
  purge_heures: 24                 # supprime les messages du banni sur les X dernières heures (0 à 168)
  titre: "🚫 Poster dans ce salon vous fera ban automatiquement, instantanément et de façon permanente"
  description: |-
    Ce salon sert **uniquement à piéger les bots de spam**.

    • Tout message envoyé ici, autre que celui-ci, est **supprimé automatiquement** et son auteur est **banni**.
    • Le staff **ne traitera aucune demande de débannissement** après un ban dans ce salon.

    Si vous êtes un vrai membre : **n'écrivez rien ici**.
  couleur: "#ED4245"